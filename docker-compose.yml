version: '3'

services:
  wp:
    image: wordpress:${WP_VERSION}
    ports:
      - ${DOMAIN}:${PORT}:80
    volumes:
      - ./.docker/wp_php.ini:/usr/local/etc/php/conf.d/conf.ini
      - ./wordpress:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: "${DB_NAME}"
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: "${DB_ROOT_PASSWORD}"
      WORDPRESS_DEBUG: 0
      WORDPRESS_TABLE_PREFIX: ${WP_TBL_PREFIX}
      WORDPRESS_CONFIG_EXTRA: |
        define('FS_METHOD', 'direct');
        define('SCRIPT_DEBUG', true);
    depends_on:
      - db
    links:
      - db

  db:
    image: mysql:${DB_VERSION}
    # platform: linux/x86_64
    restart: always
    ports:
      - ${DOMAIN}:3306:3306
    command: [
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_unicode_ci'
    ]
    volumes:
      - ./dump:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u root --password=$$DB_ROOT_PASSWORD
      interval: 5s
      retries: 10
  pma:
    image: phpmyadmin:latest
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: "root"
      PMA_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      UPLOAD_LIMIT: 50M
      PMA_ARBITRARY: 1
    ports:
      - ${DOMAIN}:8080:80
    links:
      - db:db
    volumes:
     - ./.docker/pma_php.ini:/usr/local/etc/php/conf.d/conf.ini
     - ./.docker/pma_config.php:/etc/phpmyadmin/config.user.inc.php

  wpcli:
    image: wordpress:cli
    tty: true
    command: >
      /bin/sh -c '
      sleep 15;
      wp core install --path=/var/www/html --locale=${WP_LOCALE} --url=${DOMAIN}:${PORT} --title=${WP_BLOG_NAME} --admin_user=${WP_ADMIN_LOGIN} --admin_password=${WP_ADMIN_PASSWORD} --admin_email=${WP_ADMIN_EMAIL};
      '
    # user: xfs
    user: www-data
    volumes:
      - ./.docker/wp_php.ini:/usr/local/etc/php/conf.d/conf.ini
      - ./wordpress:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: "${DB_NAME}"
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: "${DB_ROOT_PASSWORD}"
      WORDPRESS_DEBUG: 1
    depends_on:
      - db
      - wp


volumes:
  db_data:
